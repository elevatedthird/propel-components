"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: "Billboard"
status: "stable"
description: "A Hero like component that can be displayed in the middle of a page."
needs:
  - section-intro
slots:
  image:
    title: "Background Image"
  ctas:
    title: "Call to Action links"
props:
  type: object
  properties:
    eyebrow:
      type: string
      title: "Eyebrow Text"
    heading:
      type: string
      title: "Heading Text"
    description:
      type: string
      title: "Description Text"
